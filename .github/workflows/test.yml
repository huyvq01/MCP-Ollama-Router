name: Test
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - run: python -m pip install -e . -r requirements-dev.txt ruff
      - run: python -m ruff check app scripts/issue_token.py scripts/test_agent_mcp.py scripts/test_http_mcp.py tests/test_workspace_agent.py tests/test_http_agent.py
      # Live Ollama tests run locally with the full suite/smoke scripts.
      - run: python -m pytest -o addopts= -q --ignore=tests/test_engine.py --ignore=tests/test_router.py --ignore=tests/test_selector.py --ignore=tests/test_registry.py --ignore=tests/test_provider.py
