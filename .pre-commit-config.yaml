repos:
  # -----------------------------
  # Ruff (Lint + Format)
  # -----------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.7
    hooks:
      - id: ruff
        args:
          - --fix

      - id: ruff-format

  # -----------------------------
  # Mypy
  # -----------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        pass_filenames: false
        args:
          - app
          - tests

  # -----------------------------
  # Pytest
  # -----------------------------
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true