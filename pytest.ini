[pytest]
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto

markers =
    integration: requires a running Ollama server with installed models

addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=app
    --cov-report=term-missing
    --cov-report=html
